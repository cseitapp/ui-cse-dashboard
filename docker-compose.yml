version: "3.8"
services:
  dashboard:    
    image: dashboard
    build:
      context: .
      dockerfile: ./Dockerfile
    environment:
      NODE_ENV: production
    restart: always
    ports:
      - 4455:4455
  nginx:
    container_name: nginx-ui-cse-dashboard
    image: nginx:latest
    volumes:
      - ./conf.d:/etc/nginx/conf.d
    depends_on:
      - dashboard
