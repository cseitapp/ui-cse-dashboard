services:
  api:    
    image: ui-cse-dashboard:v0.1
    build:
      context: .
      dockerfile: ./Dockerfile
    environment:
      NODE_ENV: production
    restart: always
  # ports:
  #   - 2288:2288
  nginx:
    container_name: nginx-ui-cse-dashboard
    image: nginx:latest
    volumes:
      - ./conf.d:/etc/nginx/conf.d
    depends_on:
      - api
    ports:
      - 4455:4455